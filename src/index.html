<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com;" />
    <title>YouTube Hacking Player - a ụt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="drag-region">
        <span class="logo">▶</span>
        <span class="title">YouTube Hacking Player - a ụt</span>
        <button id="youtubeHomeBtn" class="youtube-home-btn" type="button" title="Mở trang chủ YouTube">
          <span class="youtube-home-icon" aria-hidden="true">▶</span>
          <span class="youtube-home-label">YouTube Home</span>
        </button>
      </div>
      <div class="window-actions">
        <button id="pinBtn" class="icon-btn" title="Ghim cửa sổ lên trên cùng" aria-label="Ghim cửa sổ">📌</button>
        <button id="minBtn" class="icon-btn" title="Thu nhỏ" aria-label="Thu nhỏ">—</button>
        <button id="maxBtn" class="icon-btn" title="Phóng to" aria-label="Phóng to">□</button>
        <button id="closeBtn" class="icon-btn close" title="Đóng" aria-label="Đóng">×</button>
      </div>
    </header>

    <main>
      <section id="controls" class="controls">
        <form id="urlForm" class="url-form">
          <label class="url-box">
            <span aria-hidden="true">⌕</span>
            <input id="urlInput" type="text" autocomplete="off" spellcheck="false" placeholder="Dán URL YouTube rồi nhấn Enter…" aria-label="URL video YouTube" />
          </label>
          <button type="submit" class="play-btn">Phát</button>
        </form>

        <div class="toolbar">
          <button id="compactBtn" class="tool-btn" type="button" title="Chỉ giữ lại khung video">▣ Khung nổi</button>
          <button id="cleanBtn" class="tool-btn active" type="button" title="Ẩn lớp phủ và tự bấm Skip khi có thể">✓ Chế độ gọn</button>
          <button id="loopBtn" class="tool-btn" type="button" title="Tự phát lại video khi kết thúc" aria-pressed="false">↻ Loop</button>
          <label class="opacity-control" title="Độ trong suốt cửa sổ">
            <span>Độ mờ</span>
            <input id="opacityRange" type="range" min="45" max="100" value="100" />
          </label>
          <span id="status" class="status">Sẵn sàng</span>
        </div>
      </section>

      <section class="player-shell">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">▶</div>
          <h1>Xem YouTube trong cửa sổ nổi</h1>
          <p>Dán đường dẫn video vào ô phía trên. Kích thước và vị trí cửa sổ sẽ được ghi nhớ.</p>
          <div class="hints"><span>📌 Luôn trên cùng</span><span>↔ Tùy chỉnh kích thước</span><span>✓ Tự bấm Skip</span></div>
        </div>
        <webview id="player" partition="persist:youtube-player"></webview>
        <div class="floating-controls">
          <span class="drag-handle" title="Kéo để di chuyển">⠿</span>
          <button id="compactHomeBtn" type="button" title="Mở trang chủ YouTube" aria-label="Mở trang chủ YouTube">⌂</button>
          <button id="compactPinBtn" type="button" title="Ghim/bỏ ghim">📌</button>
          <button id="compactLoopBtn" type="button" title="Bật loop video" aria-label="Bật loop video" aria-pressed="false">↻</button>
          <button id="showControlsBtn" type="button" title="Hiện thanh điều khiển">•••</button>
          <button id="compactCloseBtn" class="compact-close" type="button" title="Đóng">×</button>
        </div>
      </section>
    </main>

    <script src="url-parser.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
